<!DOCTYPE HTML>
<html>
  <head>
    <meta  charset="utf-8">
    <title>Transition, transform</title>
    <link rel="stylesheet" href="transformace.css" type="text/css">    
    <style>
      div{
        height: 150px;
        width: 150px;
        border-radius: 10px;
       background-color: red;
       margin: 20px;
      }
      #b1{
        transition: blue 3s ease;
      }
      #b1:hover{
        background-color: blue;
        transition: 3s ease;
        color: white;
      }
      #b2:hover{
        background-color: blue;
        transition: 3s ease;
        color: white;
        transform: translate(150px);
      }
      #b3:hover{
        background-color: blue;
        transition: 10s ease;
        color: white;
        transition: 1s ease-in-out 2s;
        transform: translate(150px);
      }
      #b4:hover{
        background-color: blue;
        transition: 3s ease;
        color: white;
        transform: scale(0.5, 0.5);
      }
  
    </style>
  </head>
  <body>
     <div id="b1">
      box1
    </div>
    
    <div id="b2">
      box2
    </div>
    
    <div id="b3">
      box3
    </div>
    
    <div id="b4">
      box4
    </div>  
  </body>
</html>
